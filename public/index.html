<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPREMACY_SPX - Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: linear-gradient(-45deg, #0d0d0d, #1a0b2e, #2a0845, #0d0d0d); background-size: 400% 400%; animation: gradientShift 15s ease infinite; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .particle { position: absolute; bottom: -100px; width: 5px; height: 5px; background: rgba(155, 89, 182, 0.8); border-radius: 50%; animation: floatUp linear infinite; }
        .card { position: relative; z-index: 10; text-align: center; background: rgba(30, 30, 30, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(155, 89, 182, 0.3); border-radius: 25px; padding: 40px; max-width: 400px; width: 90%; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); }
        .profile-img { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 4px solid rgba(155, 89, 182, 0.8); box-shadow: 0 0 30px rgba(155, 89, 182, 0.5); animation: pulseGlow 3s infinite alternate; margin-bottom: 20px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 28px; letter-spacing: 2px; margin: 0 0 10px 0; color: #fff; text-shadow: 0 0 10px #9b59b6; }
        .status-dot { width: 12px; height: 12px; background-color: #2ecc71; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #2ecc71; animation: blink 1.5s infinite; }
        .status-text { color: #2ecc71; font-weight: 600; }
        .input-group { margin: 20px 0; text-align: left; }
        label { font-size: 14px; color: #ccc; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(155,89,182,0.5); background: rgba(0,0,0,0.4); color: white; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #9b59b6; box-shadow: 0 0 10px rgba(155,89,182,0.5); }
        .btn { margin-top: 15px; background: linear-gradient(90deg, #9b59b6, #e67e22); border: none; color: white; padding: 12px 24px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #2ecc71; word-break: break-all; display: none; }
        .loader-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; margin-top: 15px; display: none; }
        .loader-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #9b59b6, #e67e22); animation: loadSystem 3s ease-in-out forwards; }
        p.footer { font-size: 12px; color: #888; margin-top: 25px; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 20px rgba(155, 89, 182, 0.4); transform: scale(1); } 100% { box-shadow: 0 0 40px rgba(155, 89, 182, 0.9); transform: scale(1.05); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes loadSystem { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="card">
        <img src="{{MENU_IMAGE}}" class="profile-img" alt="Bot Logo">
        <h1>✦ SUPREMACY_SPX ✦</h1>
        <div class="status-container">
            <span class="status-dot"></span>
            <span class="status-text">BOT SYSTEM ONLINE</span>
        </div>

        <div class="input-group">
            <label>Enter Your WhatsApp Phone Number (with country code, e.g., 254712345678)</label>
            <input type="text" id="phoneInput" placeholder="254712345678">
        </div>

        <button class="btn" id="pairBtn" onclick="requestPair()">GENERATE PAIRING CODE</button>
        <div class="loader-container" id="loader"><div class="loader-bar"></div></div>
        <div id="result"></div>

        <p class="footer">After pairing, your Session ID will be sent to your WhatsApp DM.</p>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div'); particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + 'vw'; particle.style.animationDuration = (Math.random() * 5 + 5) + 's'; particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
        }

        async function requestPair() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('pairBtn');

            if (!phone || phone.length < 10) {
                alert("Please enter a valid phone number.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "GENERATING...";
            loader.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                const res = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();

                if (data.success) {
                    resultDiv.innerText = `🔑 Your Pairing Code is:\n\n${data.code}\n\nEnter this on WhatsApp > Linked Devices > Link with phone number.`;
                    resultDiv.style.display = 'block';
                    alert("Pairing code generated! Check your WhatsApp DM for the code as well.");
                } else {
                    alert(data.message || "Failed to generate code.");
                }
            } catch (e) {
                alert("Error connecting to server.");
            }

            loader.style.display = 'none';
            btn.disabled = false;
            btn.innerText = "GENERATE PAIRING CODE";
        }
    </script>
</body>
</html>
