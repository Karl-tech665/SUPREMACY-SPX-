<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPREMACY_SPX - Pairing Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(-45deg, #0d0d0d, #1a0b2e, #2a0845, #0d0d0d);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            bottom: -100px;
            width: 5px;
            height: 5px;
            background: rgba(155, 89, 182, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(155, 89, 182, 0.8);
            animation: floatUp linear infinite;
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(30, 30, 30, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-radius: 25px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(155, 89, 182, 0.1);
        }

        /* Dynamic Image */
        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(155, 89, 182, 0.8);
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: pulseGlow 3s infinite alternate;
            margin-bottom: 20px;
        }

        /* Neon Title */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 10px #9b59b6, 0 0 20px #9b59b6, 0 0 40px #9b59b6;
        }

        /* Status Section */
        .status-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ecc71;
            animation: blink 1.5s infinite;
        }

        .status-text {
            font-weight: 600;
            color: #2ecc71;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Typewriter Text */
        .typewriter {
            font-size: 16px;
            color: #ccc;
            min-height: 24px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }

        /* System Loader */
        .loader-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9b59b6, #e67e22);
            border-radius: 10px;
            animation: loadSystem 4s ease-in-out forwards;
        }

        p.footer {
            font-size: 12px;
            color: #888;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(155, 89, 182, 0.4); transform: scale(1); }
            100% { box-shadow: 0 0 40px rgba(155, 89, 182, 0.9); transform: scale(1.05); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes loadSystem {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Particles Generated by JS -->
    <div id="particles"></div>

    <div class="card">
        <!-- Dynamic Image injected from index.js -->
        <img src="{{MENU_IMAGE}}" class="profile-img" alt="Bot Logo">

        <h1>✦ SUPREMACY_SPX ✦</h1>

        <div class="status-container">
            <div class="status-dot"></div>
            <div class="status-text">BOT SYSTEM ONLINE</div>
        </div>

        <!-- Realistic Typewriter Effect -->
        <div class="typewriter" id="typewriter">Initializing system...</div>

        <!-- Dynamic System Loader -->
        <div class="loader-container">
            <div class="loader-bar"></div>
        </div>

        <p class="footer">Powered by Supreme Prime Protocol</p>
    </div>

    <script>
        // Generate Floating Particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
        }

        // Realistic Typewriter Effect
        const phrases = [
            "Checking server status...",
            "Fetching Pairing Code...",
            "Sending to your WhatsApp DM...",
            "Waiting for user connection...",
            "System ready."
        ];
        
        const typewriterElement = document.getElementById('typewriter');
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function type() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                typewriterElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentPhrase.length) {
                typeSpeed = 2000; // Pause at end of phrase
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                typeSpeed = 500;
            }

            setTimeout(type, typeSpeed);
        }

        // Start typing
        setTimeout(type, 1000);
    </script>
</body>
    </html>
